<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background Viewer</title>
    <style>
        html, body {
            margin: 0 !important;
            padding: 0 !important;
            width: 100% !important;
            height: 100% !important;
            overflow: hidden;
        }
    </style>
    <script>
        // 1. Check URL parameters first (Instant 0ms execution)
        const params = new URLSearchParams(window.location.search);
        const urlBg = params.get('bg'); // e.g. viewer.html?bg=3498db or viewer.html?bg=gradient
        const cachedBg = localStorage.getItem('equipped_bg');

        if (urlBg) {
            document.documentElement.style.background = urlBg.startsWith('#') ? urlBg : '#' + urlBg;
        } else if (cachedBg) {
            document.documentElement.style.background = cachedBg;
        }
    </script>
</head>
<body>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbxGXgGP01t8ogK6yweY9FRuWa2SusKGx52RwJs0gtrO92pI9Bz-ZXlVpqVVO51i6uCxvQ/exec";

        // Background check to keep cache fresh
        async function fetchBackground() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();

                if (data.success && data.equipped) {
                    const config = data.equipped;
                    const bgStyle = (config.type === "Gradient")
                        ? `linear-gradient(135deg, ${config.color}, ${config.middleColor}, ${config.endColor})`
                        : config.color;

                    document.body.style.background = bgStyle;
                    document.documentElement.style.background = bgStyle;
                    localStorage.setItem('equipped_bg', bgStyle);
                }
            } catch (e) {}
        }

        fetchBackground();
    </script>
</body>
</html>
