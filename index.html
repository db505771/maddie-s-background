<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background Viewer</title>
    <style>
        html, body {
            margin: 0 !important;
            padding: 0 !important;
            width: 100% !important;
            min-height: 100vh !important;
        }

        /* Fixed Infinite Scrolling Layer */
        #bg-layer {
            position: fixed; /* Keeps background smooth while scrolling page content */
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            pointer-events: none;
            
            /* Repeat the 800px smooth gradient block endlessly down the page */
            background-repeat: repeat-y !important;
            background-size: 100% 800px !important;
            transition: background-image 0.4s ease;
        }
    </style>
    <script>
        // Formats gradients into a perfectly tileable block
        function formatBgString(config) {
            if (typeof config === "object" && config.type === "Gradient") {
                // Starts and ends with config.color to eliminate horizontal seam lines
                return `linear-gradient(180deg, ${config.color} 0%, ${config.middleColor} 50%, ${config.color} 100%)`;
            }
            if (typeof config === "string") {
                if (config.startsWith('#') || config.includes('gradient')) {
                    return config;
                }
                return '#' + config;
            }
            return config.color || '#ffffff';
        }

        function applyBackground(bgValue) {
            const bgLayer = document.getElementById('bg-layer');
            if (!bgLayer) return;

            const formattedBg = formatBgString(bgValue);

            // Use backgroundImage so we don't wipe out background-size or background-repeat
            if (formattedBg.includes('gradient')) {
                bgLayer.style.backgroundImage = formattedBg;
            } else {
                bgLayer.style.backgroundColor = formattedBg;
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            const params = new URLSearchParams(window.location.search);
            const urlBg = params.get('bg');
            const cachedBg = localStorage.getItem('equipped_bg');

            if (urlBg) {
                applyBackground(urlBg);
            } else if (cachedBg) {
                try {
                    applyBackground(JSON.parse(cachedBg));
                } catch (e) {
                    applyBackground(cachedBg);
                }
            }
        });
    </script>
</head>
<body>

    <div id="bg-layer"></div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbxGXgGP01t8ogK6yweY9FRuWa2SusKGx52RwJs0gtrO92pI9Bz-ZXlVpqVVO51i6uCxvQ/exec";

        async function syncBackground() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();

                if (data.success && data.equipped) {
                    applyBackground(data.equipped);
                    localStorage.setItem('equipped_bg', typeof data.equipped === 'object' ? JSON.stringify(data.equipped) : data.equipped);
                }
            } catch (err) {
                console.error("Failed to sync background:", err);
            }
        }

        syncBackground();
    </script>
</body>
</html>
