<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background Viewer</title>
    <style>
        html, body {
            margin: 0 !important;
            padding: 0 !important;
            width: 100% !important;
            min-height: 100vh !important;
        }

        /* Scrolling Background Layer */
        #bg-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            min-height: 100%;
            z-index: -1;
            pointer-events: none;
            transition: background 0.4s ease;
        }
    </style>
    <script>
        // Formats gradient string into a seamless repeating pattern
        function formatBgString(config) {
            if (config.type === "Gradient") {
                // Repeating linear gradient seamlessly connects start and end colors
                return `repeating-linear-gradient(135deg, ${config.color} 0%, ${config.middleColor} 50%, ${config.color} 100%)`;
            }
            return config.color;
        }

        document.addEventListener("DOMContentLoaded", () => {
            const bgLayer = document.getElementById('bg-layer');
            const params = new URLSearchParams(window.location.search);
            const urlBg = params.get('bg');
            const cachedBg = localStorage.getItem('equipped_bg');

            if (urlBg) {
                bgLayer.style.background = urlBg.startsWith('#') || urlBg.includes('gradient') ? urlBg : '#' + urlBg;
            } else if (cachedBg) {
                bgLayer.style.background = cachedBg;
            }
        });
    </script>
</head>
<body>

    <div id="bg-layer"></div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbxGXgGP01t8ogK6yweY9FRuWa2SusKGx52RwJs0gtrO92pI9Bz-ZXlVpqVVO51i6uCxvQ/exec";

        async function syncBackground() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();

                if (data.success && data.equipped) {
                    const bgStyle = formatBgString(data.equipped);
                    const bgLayer = document.getElementById('bg-layer');

                    if (bgLayer) {
                        bgLayer.style.background = bgStyle;
                    }

                    localStorage.setItem('equipped_bg', bgStyle);
                }
            } catch (err) {
                console.error("Failed to sync background:", err);
            }
        }

        syncBackground();
    </script>
</body>
</html>
